name: Update index data

on:
  schedule:
    # Every day at 05:43 UTC — after the US close of the previous day and
    # after the Tokyo close of the same day.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-update.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-update.txt

      - name: Download prices and inflation data
        run: python scripts/update_data.py

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%d)"
            git push
          fi
